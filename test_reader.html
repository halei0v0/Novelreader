<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试阅读器</title>
</head>
<body>
    <h1>测试阅读器加载</h1>
    <div id="test-results"></div>
    
    <script>
        async function testLoading() {
            const results = document.getElementById('test-results');
            results.innerHTML = '<p>正在测试...</p>';
            
            try {
                // 测试 1: 加载 novels.json
                const novelsResponse = await fetch('novels.json');
                const novels = await novelsResponse.json();
                results.innerHTML += `<p>✅ novels.json 加载成功: ${novels.length} 本小说</p>`;
                
                // 测试 2: 加载第一本小说的 meta.json
                if (novels.length > 0) {
                    const firstNovel = novels[0];
                    results.innerHTML += `<p>测试小说: ${firstNovel.title}</p>`;
                    
                    const metaResponse = await fetch(`data/${firstNovel.id}/meta.json`);
                    const meta = await metaResponse.json();
                    results.innerHTML += `<p>✅ meta.json 加载成功: ${meta.chapters_count} 章</p>`;
                    
                    // 测试 3: 加载第一个 chunk
                    const chunkResponse = await fetch(`data/${firstNovel.id}/chunk_0.json`);
                    const chunk = await chunkResponse.json();
                    results.innerHTML += `<p>✅ chunk_0.json 加载成功: ${chunk.chapters.length} 章</p>`;
                    
                    // 测试 4: 检查第一章内容
                    if (chunk.chapters.length > 0) {
                        const firstChapter = chunk.chapters[0];
                        results.innerHTML += `<p>✅ 第一章标题: ${firstChapter.title}</p>`;
                        results.innerHTML += `<p>✅ 第一章内容长度: ${firstChapter.content.length} 字符</p>`;
                        
                        // 显示内容预览
                        const preview = firstChapter.content.substring(0, 100);
                        results.innerHTML += `<p>✅ 内容预览: ${escapeHtml(preview)}...</p>`;
                    }
                }
                
                results.innerHTML += '<p style="color: green; font-weight: bold;">✅ 所有测试通过！</p>';
            } catch (error) {
                results.innerHTML += `<p style="color: red; font-weight: bold;">❌ 测试失败: ${error.message}</p>`;
                console.error(error);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 运行测试
        testLoading();
    </script>
</body>
</html>
