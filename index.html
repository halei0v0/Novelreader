<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说阅读器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="book-icon">📚</i> 小说阅读器
                </a>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="container main-content">
            <div class="page-header">
                <h1>小说列表</h1>
                <p class="text-muted">选择一本小说开始阅读</p>
            </div>

            <!-- 搜索框 -->
            <div class="search-container mb-4">
                <div class="search-box">
                    <input type="text" id="search-input" class="form-control" placeholder="搜索小说名称、作者..." oninput="filterNovels()">
                    <button class="search-btn" onclick="clearSearch()">
                        <span id="search-icon">🔍</span>
                    </button>
                </div>
                <div class="search-info" id="search-info"></div>
            </div>

            <!-- 小说列表 -->
            <div id="novel-list" class="row g-4">
                <!-- 动态加载小说卡片 -->
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="bg-light py-4 mt-5">
            <div class="container text-center text-muted">
                <small>进度自动保存 | 阅读体验流畅</small><br>
                <small>作者: <a href="https://github.com/halei0v0" target="_blank" class="text-muted text-decoration-none">@halei0v0</a></small>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
    <script>
        // 加载小说列表
        loadNovelList();
    </script>
</body>
</html>
