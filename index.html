<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说阅读器【Novelreader】</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <svg class="book-icon" width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 000 2.5v11a.5.5 0 00.707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 00.78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0016 13.5v-11a.5.5 0 00-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/>
                    </svg>
                    小说阅读器【Novelreader】
                </a>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="container main-content">
            <div class="page-header">
                <h1>小说列表</h1>
                <p class="text-muted">选择一本小说开始阅读</p>
                <p class="text-muted" id="novel-count"></p>
            </div>

            <!-- 搜索框 -->
            <div class="search-container mb-4">
                <div class="search-box">
                    <input type="text" id="search-input" class="form-control" placeholder="搜索小说名称、作者..." oninput="filterNovels()">
                    <button class="search-btn" onclick="clearSearch()">
                        <span id="search-icon">🔍</span>
                    </button>
                </div>
                <div class="search-info" id="search-info"></div>
            </div>

            <!-- 阅读历史 -->
            <div id="reading-history" class="reading-history-container mb-4" style="display: none;">
                <div class="history-header">
                    <h3>
                        <svg class="history-icon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M2 2a2 2 0 012-2h8a2 2 0 012 2v13.5a.5.5 0 01-.777.416L8 13.101l-5.223 2.815A.5.5 0 012 15.5V2z"/>
                        </svg>
                        最近阅读
                    </h3>
                    <button class="clear-history-btn" onclick="clearHistory()">清空</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- 动态加载历史记录 -->
                </div>
            </div>

            <!-- 小说列表 -->
            <div id="novel-list" class="row g-4">
                <!-- 动态加载小说卡片 -->
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="bg-light py-4 mt-5">
            <div class="container text-center text-muted">
                <small>进度自动保存 | 阅读体验流畅</small><br>
                <small>作者: <a href="https://github.com/halei0v0" target="_blank" class="text-muted text-decoration-none">@halei0v0</a></small>
            </div>
        </footer>

        <!-- 加载提示框 -->
        <div class="loading-overlay" id="loading-overlay" style="display: none;">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">正在打开小说...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // 加载小说列表
        loadNovelList();
    </script>
</body>
</html>
