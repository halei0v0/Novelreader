<body>
    <div class="app-container">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <svg class="book-icon" width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 000 2.5v11a.5.5 0 00.707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 00.78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0016 13.5v-11a.5.5 0 00-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/>
                    </svg>
                    小说阅读器【Novelreader】
                </a>
            </div>
        </nav>

        <!-- 主内容区 -->
        <div class="container main-content">
            <div class="page-header">
                <h1>小说列表</h1>
                <p class="text-muted">选择一本小说开始阅读</p>
                <p class="text-muted" id="novel-count"></p>
            </div>

            <!-- 搜索框 -->
            <div class="search-container mb-4">
                <div class="search-box">
                    <input type="text" id="search-input" class="form-control" placeholder="搜索小说名称、作者..." oninput="filterNovels()">
                    <button class="search-btn" onclick="clearSearch()">
                        <span id="search-icon">🔍</span>
                    </button>
                </div>
                <div class="search-info" id="search-info"></div>
            </div>

            <!-- 分类筛选 -->
            <div class="category-container mb-4" id="category-container">
                <!-- 分类按钮动态加载 -->
            </div>

            <!-- 功能按钮 -->
            <div class="feature-buttons mb-4">
                <button class="feature-btn" onclick="showRanking('hot')">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M8 13A5 5 0 1 1 8 3a5 5 0 0 1 0 10zm0 1A6 6 0 1 0 8 2a6 6 0 0 0 0 12z"/>
                        <path d="M8 11A3 3 0 1 1 8 5a3 3 0 0 1 0 6zm0 1A4 4 0 1 0 8 4a4 4 0 0 0 0 8z"/>
                        <path d="M9.5 8a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
                    </svg>
                    排行榜
                </button>
                <button class="feature-btn" onclick="randomRecommend()">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445z"/>
                    </svg>
                    随机推荐
                </button>
                <button class="feature-btn" onclick="showFavoritesOnly()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="heart-icon">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    我的收藏
                </button>
                <button class="feature-btn" onclick="showReadingStats()">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M1 11a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-3zm5-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V2z"/>
                    </svg>
                    阅读统计
                </button>
                <button class="feature-btn" onclick="showAboutPage()">
                    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286zm1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94z"/>
                    </svg>
                    关于
                </button>
            </div>

            <!-- 阅读历史 -->
            <div id="reading-history" class="reading-history-container mb-4" style="display: none;">
                <div class="history-header">
                    <h3>
                        <svg class="history-icon" width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M2 2a2 2 0 012-2h8a2 2 0 012 2v13.5a.5.5 0 01-.777.416L8 13.101l-5.223 2.815A.5.5 0 012 15.5V2z"/>
                        </svg>
                        最近阅读
                    </h3>
                    <button class="clear-history-btn" onclick="clearHistory()">清空</button>
                </div>
                <div id="history-list" class="history-list">
                    <!-- 动态加载历史记录 -->
                </div>
            </div>

            <!-- 小说列表 -->
            <div id="novel-list" class="row g-4">
                <!-- 动态加载小说卡片 -->
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="bg-light py-4 mt-5">
            <div class="container text-center text-muted">

                <small>作者: <a href="https://github.com/halei0v0" target="_blank" class="text-muted text-decoration-none">@halei0v0</a></small>
            </div>
        </footer>

        <!-- 加载提示框 -->
        <div class="loading-overlay" id="loading-overlay" style="display: none;">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">正在打开小说...</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // 加载小说列表
        loadNovelList();
        
        // 等待小说数据加载完成后添加分类
        setTimeout(() => {
            if (allNovelsMeta) {
                addCategoriesToNovels();
                renderCategoryButtons();
            }
        }, 500);
    </script>
</body>
</html>
