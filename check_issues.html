<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问题检查</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>网站问题检查</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(type, message) {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        async function checkIssues() {
            addResult('section', '<h3>检查结果</h3>');
            
            // 检查 1: novels.json
            try {
                const novelsResponse = await fetch('novels.json');
                if (novelsResponse.ok) {
                    const novels = await novelsResponse.json();
                    addResult('success', `✅ novels.json 加载成功: ${novels.length} 本小说`);
                } else {
                    addResult('error', `❌ novels.json 加载失败: ${novelsResponse.status}`);
                }
            } catch (error) {
                addResult('error', `❌ novels.json 加载错误: ${error.message}`);
            }
            
            // 检查 2: app.js
            try {
                const appScript = document.createElement('script');
                appScript.src = 'app.js';
                appScript.onload = () => addResult('success', '✅ app.js 加载成功');
                appScript.onerror = () => addResult('error', '❌ app.js 加载失败');
                document.head.appendChild(appScript);
            } catch (error) {
                addResult('error', `❌ app.js 加载错误: ${error.message}`);
            }
            
            // 检查 3: 数据完整性
            setTimeout(async () => {
                try {
                    const novelsResponse = await fetch('novels.json');
                    const novels = await novelsResponse.json();
                    
                    if (novels.length > 0) {
                        const firstNovel = novels[0];
                        const metaResponse = await fetch(`data/${firstNovel.id}/meta.json`);
                        
                        if (metaResponse.ok) {
                            const meta = await metaResponse.json();
                            addResult('success', `✅ 数据完整性检查通过: ${firstNovel.title} 有 ${meta.chapters_count} 章`);
                        } else {
                            addResult('error', `❌ meta.json 加载失败: ${firstNovel.id}`);
                        }
                    }
                } catch (error) {
                    addResult('error', `❌ 数据完整性检查错误: ${error.message}`);
                }
            }, 1000);
            
            // 检查 4: 关键函数是否存在
            setTimeout(() => {
                const requiredFunctions = [
                    'loadNovelList',
                    'filterNovels',
                    'openNovel',
                    'initReader',
                    'loadChapter',
                    'prevChapter',
                    'nextChapter',
                    'setTheme',
                    'setFontSize',
                    'setLineHeight',
                    'toggleBookmark',
                    'toggleSettings',
                    'toggleTOC',
                    'shareNovel',
                    'showRelatedRecommendations'
                ];
                
                const missingFunctions = requiredFunctions.filter(fn => typeof window[fn] !== 'function');
                
                if (missingFunctions.length === 0) {
                    addResult('success', '✅ 所有关键函数都已定义');
                } else {
                    addResult('error', `❌ 缺少函数: ${missingFunctions.join(', ')}`);
                }
            }, 2000);
            
            // 检查 5: localStorage 支持
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                addResult('success', '✅ localStorage 支持正常');
            } catch (error) {
                addResult('error', '❌ localStorage 不可用');
            }
            
            // 检查 6: sessionStorage 支持
            try {
                sessionStorage.setItem('test', 'test');
                sessionStorage.removeItem('test');
                addResult('success', '✅ sessionStorage 支持正常');
            } catch (error) {
                addResult('error', '❌ sessionStorage 不可用');
            }
            
            // 检查 7: 文件列表
            const requiredFiles = [
                'index.html',
                'reader.html',
                'app.js',
                'styles.css',
                'novels.json'
            ];
            
            requiredFiles.forEach(file => {
                fetch(file, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            addResult('success', `✅ ${file} 存在`);
                        } else {
                            addResult('error', `❌ ${file} 无法访问 (${response.status})`);
                        }
                    })
                    .catch(() => {
                        addResult('error', `❌ ${file} 加载失败`);
                    });
            });
        }
        
        checkIssues();
    </script>
</body>
</html>
